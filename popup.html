<!DOCTYPE html>
<html lang="en" class="pre-intro">
  <head>
    <meta charset="utf-8" />
    <title>Jokes By JC</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="ad.css" />
  </head>
  <body>
    <div class="popup-container">
      <header class="header">
        <h1 class="title">Jokes By JC</h1>
        <button type="button" id="close-popup" class="close-button" aria-label="Close extension popup">×</button>
      </header>

      <main class="content">
        <!-- Joke and Avatar Section -->
        <div class="flex-container stage">
          <div id="joke-container" aria-live="polite" role="status">
            <p id="joke">Hey, wanna hear a joke?</p>
          </div>
          <div class="avatar-stage" role="img" aria-label="JC mascot avatar">
            <div class="avatar-breathe">
              <div class="avatar-body">
                <div class="avatar-flip">
                  <img class="pose" data-pose="intro" src="images/intro.png" alt="" />
                  <img class="pose" data-pose="thinking" src="images/thinking.png" alt="" />
                  <img class="pose" data-pose="lol" src="images/lol.png" alt="" />
                  <img class="pose" data-pose="coolguy" src="images/coolguy.png" alt="" />
                  <!-- Mirrored back, so JC points toward the speech bubble. -->
                  <img class="pose pose-unflip" data-pose="pointing" src="images/pointing.png" alt="" />
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Button Section -->
        <div class="button-container">
          <button type="button" id="yes-button" class="button button-blue" aria-label="Yes, tell me a joke">Yes</button>
          <button type="button" id="no-button" class="button button-secondary" aria-label="No thanks, close popup">No</button>
        </div>
      </main>

      <footer class="footer">
        <!-- Company Ad Section -->
        <a href="https://dfwsc.com" target="_blank" rel="noopener noreferrer" class="ad-container ad-logo-tile" aria-label="DFWSC Software Consulting, visit dfwsc.com for custom software">
          <span class="ad-lockup">
            <img src="images/dfwsc-mark.svg" alt="" class="ad-logo" />
            <span class="ad-wordmark" aria-hidden="true">Software<br />Consulting</span>
          </span>
          <span class="ad-fallback" hidden>
            <span class="ad-text">Need custom software?</span>
            <span class="ad-link">dfwsc.com</span>
          </span>
        </a>

        <!-- Personal Blog Ad Section -->
        <a href="https://www.byjc.dev" target="_blank" rel="noopener noreferrer" class="ad-container" aria-label="My blog, www.byjc.dev">
          <span class="ad-fallback">
            <span class="ad-text">My blog</span>
            <span class="ad-link">www.byjc.dev</span>
          </span>
        </a>
      </footer>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
